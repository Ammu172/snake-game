apiVersion: apps/v1
kind: Deployment
metadata:
  name: snake-game
spec:
  replicas: 2

  selector:
    matchLabels:
      app: snake-game

  template:
    metadata:
      labels:
        app: snake-game

    spec:
      containers:
      - name: snake-game

        image: ammu172/snake:v1

        ports:
        - containerPort: 80
